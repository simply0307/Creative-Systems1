[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/reath-functions"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  REATH_RUNTIME_CONTEXT = "production"
  REATH_AI_ENABLED = "false"
  SUPABASE_PROJECT_REF = "okqkljexfzolzxysjaha"

[context.deploy-preview.environment]
  REATH_RUNTIME_CONTEXT = "deploy-preview"
  REATH_AI_ENABLED = "false"

[context.branch-deploy.environment]
  REATH_RUNTIME_CONTEXT = "branch-deploy"
  REATH_AI_ENABLED = "false"

[context.dev.environment]
  REATH_RUNTIME_CONTEXT = "local"
  REATH_AI_ENABLED = "false"
