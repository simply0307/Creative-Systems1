name: Production Supabase migration

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed main-branch commit SHA
        required: true
        type: string
      expected_migrations:
        description: Comma-separated approved 14-digit migration versions
        required: true
        type: string
      production_confirmation:
        description: Type DEPLOY-CREATIVE-OS-MIGRATIONS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: creative-os-production-supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Guarded canonical migration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.113.0

      - name: Run the sole production migration gate
        env:
          CREATIVE_OS_PRODUCTION_MIGRATION_RUNNER: github-actions
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: >-
          npm run supabase:migrate:production --
          --apply
          --expected-branch=main
          --expected-commit="$EXPECTED_COMMIT"
          --expected-migrations="$EXPECTED_MIGRATIONS"
          --confirm-project-ref=okqkljexfzolzxysjaha
          --confirm-production="$PRODUCTION_CONFIRMATION"
